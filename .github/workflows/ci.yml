name: Evolua CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build e validação
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Instalar dependências dos scripts de administrador
        working-directory: backend
        run: npm ci --omit=dev

      - name: Validar scripts de administrador
        working-directory: backend
        run: npm run build
